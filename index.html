<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delphin DM</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 15px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 600px; margin: 15px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    h1, h2 { color: #f59e0b; margin-top: 0; }
    textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; resize: vertical; box-sizing: border-box; font-size: 16px; }
    button { background: #f59e0b; color: #0f172a; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 15px; }
    .btn-secondary { background: #0284c7; color: white; margin-left: 8px; }
    .message { margin-top: 12px; padding: 12px; border-radius: 8px; background: #1e3a8a; font-size: 15px; line-height: 1.4; }
    .user-msg { background: #334155; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Bienvenue sur Delphin DM 👋</h1>
    <p>Discute, pose tes questions et découvre les possibilités de l'intelligence artificielle.</p>
  </div>

  <div class="card">
    <h2>💬 Discussion avec l'IA</h2>
    <div id="messages">
      <div class="message">🤖 Bonjour ! Bienvenue sur Delphin DM. Comment puis-je t'aider aujourd'hui ?</div>
    </div>
    <br>
    <textarea id="question" rows="3" placeholder="Écris ton message ici..."></textarea>
    <br>
    <button onclick="envoyer()">Envoyer</button>
    <button class="btn-secondary" onclick="effacer()">Effacer la discussion</button>
  </div>

  <script>
    function effacer() {
      document.getElementById('messages').innerHTML = '<div class="message">🤖 Discussion réinitialisée. Pose ta question !</div>';
    }

    async function envoyer() {
      const input = document.getElementById('question');
      const promptText = input ? input.value.trim() : '';
      if (!promptText) return;

      const messagesDiv = document.getElementById('messages');
      if (messagesDiv) {
        messagesDiv.innerHTML += `<div class="message user-msg"><strong>Moi :</strong> ${promptText}</div>`;
      }
      if (input) input.value = '';

      try {
        const response = await fetch("https://hidden-term-b5fa.delphinmatata84.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        
        // Détection automatique du bon format de réponse de l'IA
        let reponseTexte = "";
        if (typeof data === "string") {
          reponseTexte = data;
        } else if (data.response) {
          reponseTexte = data.response;
        } else if (data.result && data.result.response) {
          reponseTexte = data.result.response;
        } else {
          reponseTexte = JSON.stringify(data);
        }

        if (messagesDiv) {
          messagesDiv.innerHTML += `<div class="message"><strong>Delphin DM AI :</strong> ${reponseTexte}</div>`;
        }
      } catch (error) {
        if (messagesDiv) {
          messagesDiv.innerHTML += `<div class="message" style="background:#7f1d1d;"><strong>Erreur :</strong> Impossible de joindre l'IA.</div>`;
        }
      }
    }
  </script>

</body>
</html>
